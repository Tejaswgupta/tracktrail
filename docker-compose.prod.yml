# Production Docker Compose configuration for TrackTrail Backend
# This file is used by the CI/CD pipeline to build and deploy the application

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tracktrail-backend
    restart: unless-stopped
    ports:
      - "3011:3011"
    env_file:
      - ./backend/.env
    environment:
      # Override for production
      - DEBUG=false
      - LOG_LEVEL=INFO
      - CORS_ORIGINS=${CORS_ORIGINS}
    networks:
      - tracktrail-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3011/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  tracktrail-network:
    driver: bridge

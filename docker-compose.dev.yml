# Development Docker Compose configuration for TrackTrail Backend
# This file is optimized for local development with hot-reload

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tracktrail-backend-dev
    restart: unless-stopped
    ports:
      - "3011:3011"
    volumes:
      - ./backend:/app
      - /app/.venv  # Prevent overwriting the virtual environment
    env_file:
      - ./backend/.env
    environment:
      # Override for development
      - DEBUG=true
      - LOG_LEVEL=DEBUG
      - CORS_ORIGINS=http://localhost:3000,http://127.0.0.1:3000,http://localhost:3001,http://127.0.0.1:3001
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://model.thevotum.com/v1}
    networks:
      - tracktrail-network
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "3011", "--reload"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3011/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  tracktrail-network:
    driver: bridge

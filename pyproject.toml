[project]
name = "enforcement_analytics"
version = "0.1.0"
description = "Enforcement analytics system for detecting suspicious financial activities"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "neo4j>=5.14.0",
    "networkx>=3.1.0",
    "matplotlib>=3.7.0",
    "pyvis>=0.3.2",
    "fastapi>=0.104.0",
    "uvicorn>=0.23.0",
    "pydantic>=2.0.0",
    "sqlalchemy>=2.0.0",
    "aiosqlite>=0.19.0",
    "python-dotenv>=1.0.0",
    "pandas>=1.5.0",
    "numpy>=1.24.0",
    "plotly>=6.2.0",
    "streamlit>=1.47.1",
    "fuzzywuzzy>=0.18.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.5.0"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 88


[tool.ruff.lint]
ignore = ["E722"]
